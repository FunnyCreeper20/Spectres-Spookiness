<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsaken OST Generator</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, rgba(120, 0, 0, 0.18), transparent 45%),
                linear-gradient(180deg, #090909, #000000 45%, #0a0000);
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        .app {
            position: relative;
            z-index: 1;
            width: min(90vw, 900px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 24px;
            box-sizing: border-box;
        }

        .binaryBackground {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .binaryBackground::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.72));
        }

        .binaryColumn {
            position: absolute;
            top: -140%;
            font-family: "Courier New", monospace;
            font-size: 26px;
            line-height: 1.45;
            letter-spacing: 8px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
            white-space: pre;
            user-select: none;
            animation: binaryFall linear infinite;
        }

        .binaryDigit {
            display: inline-block;
            min-width: 0.8em;
            text-align: center;
        }

        @keyframes binaryFall {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(240vh);
            }
        }

        /* Fancy gold + quartz button */
        #fancyButton {
            position: relative;
            padding: 18px 45px;
            font-size: 20px;
            color: #ffd7d7;

            background: rgba(20, 0, 0, 0.72);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 32, 32, 0.38);
            border-radius: 14px;

            cursor: pointer;
            overflow: hidden;

            box-shadow:
                inset 0 0 10px rgba(255,120,120,0.14),
                0 0 22px rgba(255,0,0,0.24);

            transition: all 0.3s ease;
        }

        /* Gold animated border */
        #fancyButton::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 16px;

            background: linear-gradient(
                120deg,
                #420000,
                #ff1a1a,
                #8a0000,
                #420000
            );

            background-size: 300%;
            z-index: -1;
            animation: goldFlow 6s linear infinite;
        }

        @keyframes goldFlow {
            0% { background-position: 0%; }
            100% { background-position: 300%; }
        }

        /* Quartz shine overlay */
        #fancyButton::after {
            content: "";
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;

            background: linear-gradient(
                120deg,
                transparent,
                rgba(255,160,160,0.35),
                transparent
            );

            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { left: -75%; }
            100% { left: 150%; }
        }

        /* Hover glow */
        #fancyButton:hover {
            transform: scale(1.08);
            box-shadow:
                0 0 25px rgba(255,0,0,0.55),
                0 0 60px rgba(140,0,0,0.35),
                inset 0 0 15px rgba(255,130,130,0.2);
        }

        #fancyButton:active {
            transform: scale(0.95);
        }

        .info {
            text-align: center;
            color: #ffd7d7;
        }

        #name,
        #participants {
            margin: 0;
        }

        #name {
            font-size: 24px;
            font-weight: 700;
        }

        #participants {
            font-size: 16px;
            opacity: 0.9;
        }

        #videoFallback {
            color: #ff9898;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 32, 32, 0.35);
        }

        #videoFallback:hover {
            color: #ffe3e3;
            border-bottom-color: rgba(255, 160, 160, 0.8);
        }

        .playerFrame {
            position: relative;
            width: min(100%, 760px);
            aspect-ratio: 16 / 9;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(10, 0, 0, 0.6);
            box-shadow:
                inset 0 0 10px rgba(255,120,120,0.08),
                0 0 30px rgba(255,0,0,0.2),
                0 0 65px rgba(120, 0, 0, 0.24);
        }

        .playerFrame::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 3px;
            border-radius: 18px;
            background:
                linear-gradient(135deg, rgba(255, 120, 120, 0.95), rgba(170, 0, 0, 0.92), rgba(255, 120, 120, 0.95)),
                linear-gradient(45deg, rgba(255,120,120,0.3), rgba(255,120,120,0));
            background-size: 220% 220%;
            animation: framePulse 5s linear infinite;
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .playerFrame::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 120, 120, 0.26);
            box-shadow:
                inset 0 0 18px rgba(255, 120, 120, 0.08),
                0 0 25px rgba(255, 0, 0, 0.14);
            pointer-events: none;
        }

        @keyframes framePulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 18px;
            background: #000;
        }

    </style>
</head>

<body>
    <div class="binaryBackground" id="binaryBackground" aria-hidden="true"></div>
    <main class="app">
        <button id="fancyButton" type="button">Generate OST</button>
        <div class="info">
            <p id="name">Name</p>
            <p id="participants">X vs X</p>
            <br>
            <a id="videoFallback" href="#" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
        </div>
        <div class="playerFrame">
            <iframe
                id="videoPlayer"
                title="Forsaken OST Player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
            ></iframe>
        </div>
    </main>

    <script>
        const button = document.getElementById('fancyButton');
        const binaryBackground = document.getElementById('binaryBackground');
        const nameDisplay = document.getElementById('name');
        const participantsDisplay = document.getElementById('participants');
        const videoFallback = document.getElementById('videoFallback');
        const videoPlayer = document.getElementById('videoPlayer');

        const listOfLMS = [ // Has 14 items and all are in the game
            ["https://www.youtube.com/watch?v=F6KJJ3iwK4A", "A Grave Soul (Now Run)", "Anyone vs Anyone"],
            ["https://www.youtube.com/watch?v=e_dmRDw2bCM", "Plead", "007n7 vs c00lkidd"],
            ["https://www.youtube.com/watch?v=RoFJA-b8f20", "Creation of Hatred", "1x1x1x1 vs Shedletsky"],
            ["https://www.youtube.com/watch?v=sgsPH86POmo", "Butcher's Vanity", "Vanity Slasher vs Anyone"],
            ["https://www.youtube.com/watch?v=kjVgaeTi3bQ", "SMILE", "Cupcakes c00lkidd vs Anyone"],
            ["https://www.youtube.com/watch?v=_WNJu-yZO14", "Close to Me", "Annihlation John Doe vs Friend Elliot"],
            ["https://www.youtube.com/watch?v=gFE2g5B7hBI", "Compass", "Gasharpoon John Doe vs Anyone"],
            ["https://www.youtube.com/watch?v=YAWbsdkitWQ", "Burnout", "Diva 1x1x1x1 vs Ghoul Two Time"],
            ["https://www.youtube.com/watch?v=EFr031pIlmg", "Through Patches of Violet", "Hacklord 1x1x1x1 vs Heartbroken Shedletsky"],
            ["https://youtu.be/mznKvNaE8Fc?list=RDmznKvNaE8Fc", "Dead Ringer", "Guest 666 vs Noob"],
            ["https://youtu.be/5_OoBrof_HA?list=RD5_OoBrof_HA", "Perpetuity", "Any DOD Killer vs Any DOD Survivor"],
            ["https://youtu.be/x492r4IUSbA?list=RDx492r4IUSbA", "FOR OLD TIMES SAKE", "Crazyblox 1x1x1x1 vs The Guide Shedletsky"],
            ["https://youtu.be/fivsLkKvkjI?list=RDfivsLkKvkjI", "Profitable Passion", "Anyone vs Any Golden Skin"],
            ["https://www.youtube.com/watch?v=Fahyr3DQV2M", "You and I", "John Doe vs Jane Doe"]
        ];
        const listOfVIPLMS = [ // Has 6 items and all require the VIP pass to access
            ["https://www.youtube.com/watch?v=nKs6LZzaEdE", "[VIP] Hero", "Sancho vs Anyone"],
            ["https://www.youtube.com/watch?v=YWMtuE_npzQ", "[VIP] A Creation of Sorrow", "Erlking vs Anyone"],
            ["https://www.youtube.com/watch?v=NYYOMVYHfB0", "[VIP] ATSITUAB LEINAD", "BRIMSTONE vs Anyone"],
            ["https://www.youtube.com/watch?v=56qLZ5ncJv8", "[VIP] More Guns Reversed", "Shedletsky vs Anyone"], //This doesn't actually have an LMS name, but it is Team fortress 2 more guns, but in reverse
            ["https://www.youtube.com/watch?v=3wAX9rdSvOY", "[VIP] Eternal Hope, Eternal Fight", "Friday 13th Slasher or Dexter Slasher vs Anyone"],
            ["https://www.youtube.com/watch?v=krgCnLF5dtw", "[VIP] Faith's Answer", "March 18th John Doe vs Anyone"],
        ];
        const goneLMS = [ // Has 6 items and all are no longer in the game
            ["https://www.youtube.com/watch?v=L7D34ut7wxA", "[REMOVED] YOUR.PROBLEM", "JX1DX1 Noli vs IHasAFaceLULZ Noob or Aubree Noob"],
            ["https://www.youtube.com/watch?v=vq2AfGYwbE4", "[REMOVED] Eternal Hope, Eternal Fight", "Anyone vs Anyone"],
            ["https://www.youtube.com/watch?v=_EgA4K6cfW4", "[REMOVED] Meet Your Making", "1x1x1x1 vs Shedletsky or c00lkidd vs 007n7"],
            ["https://www.youtube.com/watch?v=kaBX8OUbXlM", "[REMOVED] Undying Faith", "March 18th John Doe vs Anyone"],
            ["https://www.youtube.com/watch?v=HPRMXOObHms", "[SCRAPPED] Recading Lifespan", "Barber Slasher vs Bald Two Time"],
            ["https://www.youtube.com/watch?v=oa5gWk0aRak", "[SCRAPPED] Made Just For You", "Bluudud c00lkidd vs 118o8 007n7"],
        ]

        const lms = listOfLMS.concat(listOfVIPLMS).concat(goneLMS);
        let lastSelectedIndex = -1;

        function createBinaryRain() {
            const columnCount = 16;
            const lineCount = 26;
            const redPalette = [
                'rgba(255, 40, 40, 0.78)',
                'rgba(220, 22, 22, 0.72)',
                'rgba(176, 0, 0, 0.68)',
                'rgba(255, 110, 110, 0.62)',
                'rgba(120, 0, 0, 0.58)'
            ];

            for (let columnIndex = 0; columnIndex < columnCount; columnIndex += 1) {
                const column = document.createElement('div');
                const left = (columnIndex / columnCount) * 100;

                column.className = 'binaryColumn';
                column.style.left = `${left + (Math.random() * 1.5 - 0.75)}%`;
                column.style.opacity = `${0.42 + Math.random() * 0.38}`;
                column.style.animationDuration = `${11 + Math.random() * 8}s`;
                column.style.animationDelay = `-${Math.random() * 12}s`;

                for (let lineIndex = 0; lineIndex < lineCount; lineIndex += 1) {
                    const line = document.createElement('div');

                    for (let digitIndex = 0; digitIndex < 7; digitIndex += 1) {
                        const digit = document.createElement('span');
                        digit.className = 'binaryDigit';
                        digit.textContent = Math.random() > 0.5 ? '1' : '0';
                        digit.style.color = redPalette[Math.floor(Math.random() * redPalette.length)];
                        line.appendChild(digit);
                    }

                    column.appendChild(line);
                }

                binaryBackground.appendChild(column);
            }
        }

        function getEmbedUrl(videoUrl) {
            try {
                const url = new URL(videoUrl);
                let videoId = '';

                if (url.hostname.includes('youtu.be')) {
                    videoId = url.pathname.split('/').filter(Boolean)[0] || '';
                } else if (url.pathname.startsWith('/embed/')) {
                    videoId = url.pathname.split('/')[2] || '';
                } else if (url.pathname.startsWith('/shorts/')) {
                    videoId = url.pathname.split('/')[2] || '';
                } else {
                    videoId = url.searchParams.get('v') || '';
                }

                if (!videoId) {
                    return '';
                }

                return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            } catch {
                return '';
            }
        }

        createBinaryRain();

        button.addEventListener('click', () => {
            let randomIndex = Math.floor(Math.random() * lms.length);

            if (lms.length > 1) {
                while (randomIndex === lastSelectedIndex) {
                    randomIndex = Math.floor(Math.random() * lms.length);
                }
            }

            lastSelectedIndex = randomIndex;
            const selectedLMS = lms[randomIndex];
            const embedUrl = getEmbedUrl(selectedLMS[0]);

            nameDisplay.textContent = selectedLMS[1];
            participantsDisplay.textContent = selectedLMS[2];
            videoFallback.href = selectedLMS[0];

            if (!embedUrl) {
                videoPlayer.removeAttribute('src');
                return;
            }

            videoPlayer.src = '';
            videoPlayer.src = embedUrl;
        });
    </script>

</body>
</html>
